
name: Testes de seguranca das senhas

on:
  push:
    branches:
      - desenvolvimento-sites-v2
    
    paths:
      - "worker/auth/password.js"
      - "worker/auth/password.test.mjs"
      - "worker/auth/session.js"
      - "worker/auth/session.test.mjs"
      - ".github/workflows/test-passwords.yml"
      - "worker/auth/login.js"
      - "worker/auth/login.test.mjs"


  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-senhas:
    name: Validar modulo de senhas
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Executar testes de senhas
        run: node --test worker/auth/*.test.mjs
