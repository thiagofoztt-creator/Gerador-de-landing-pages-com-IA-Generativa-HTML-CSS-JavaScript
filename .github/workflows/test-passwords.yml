
name: Testes de seguranca das senhas

on:
  push:
    branches:
      - desenvolvimento-sites-v2
        
    paths:
      - "worker/auth/**"
      - "worker/index.js"
      - ".github/workflows/test-passwords.yml"


  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-senhas:
    name: Validar modulo de senhas
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Executar testes de senhas
        run: node --test worker/auth/*.test.mjs
